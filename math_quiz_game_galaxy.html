<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATH QUIZ : พิชิตสูตรคณิตศาสตร์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ede9fe;--bg2:#fce7f3;--card:#fff;--tx:#1e1b4b;--mut:#6b7280;--pu:#7c3aed;--bl:#2563eb;--pk:#ec4899;--gr:#16a34a;--or:#f97316;--ln:#e5e7eb;--ok:#dcfce7;--no:#fee2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e1b4b;--bg2:#3b0764;--card:#2a2560;--tx:#f5f3ff;--mut:#c4b5fd;--ln:#4c4590;--ok:#14532d;--no:#7f1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1e1b4b;--bg2:#3b0764;--card:#2a2560;--tx:#f5f3ff;--mut:#c4b5fd;--ln:#4c4590;--ok:#14532d;--no:#7f1d1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;line-height:1.5}
#app{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(124,58,237,.18);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:30px 20px}
.hero .big{font-size:64px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
h1{margin:6px 0;font-size:clamp(28px,7vw,44px);background:linear-gradient(90deg,var(--pu),var(--pk),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px}
.sub{color:var(--mut);margin:4px 0 18px}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:13px 26px;color:#fff;background:linear-gradient(90deg,var(--pu),var(--bl));cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:linear-gradient(90deg,var(--pk),var(--or))}
.btn.ghost{background:var(--ln);color:var(--tx);box-shadow:none}
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-size:14px}
.rules span{background:var(--bg1);border-radius:99px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.cat{font:inherit;color:#fff;border:0;border-radius:20px;padding:18px 14px;text-align:left;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.15s}
.cat:hover{transform:translateY(-3px)}.cat b{display:block;font-size:17px}.cat small{opacity:.9}.cat .ic{font-size:30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.pill{background:var(--bg1);border-radius:99px;padding:4px 12px}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gr),var(--bl));transition:width .4s}
.bar.t i{background:linear-gradient(90deg,var(--or),var(--pk));transition:width 1s linear}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600;margin-right:6px}
.bonus{background:var(--or)}
.q{font-size:clamp(19px,4.6vw,24px);font-weight:600;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:clamp(17px,4.2vw,20px);text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pu);transform:translateX(4px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg1);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.ok{background:var(--ok);border-color:var(--gr);animation:pop .4s}
.opt.no{background:var(--no);border-color:#ef4444;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:14px;padding:14px;border-radius:16px;background:var(--bg1);animation:in .3s}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.score{font-size:64px;font-weight:700;color:var(--pu);margin:0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stats div{background:var(--bg1);border-radius:16px;padding:10px 18px;min-width:110px}
.stats b{display:block;font-size:24px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.2;margin:0 2px}
.fr i{font-style:normal;border-bottom:1.5px solid currentColor;padding:0 3px}.fr b{font-weight:400;padding:0 3px}
.m{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-style:italic;white-space:nowrap}
.m sub,.m sup{font-size:.7em}
.c{text-align:center}
.formula-modal{position:fixed;inset:0;z-index:999;background:rgba(10,8,35,.78);display:flex;align-items:center;justify-content:center;padding:14px}
.formula-panel{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:22px;padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.4)}
.formula-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-20px;background:var(--card);padding:4px 0 12px;z-index:1}
.formula-group{background:var(--bg1);border-radius:16px;padding:14px;margin:12px 0}
.formula-group h3{margin:0 0 8px;font-size:17px}
.formula-item{padding:8px 0;border-top:1px solid var(--ln)}
.formula-item:first-of-type{border-top:0}
.formula-item b{display:block;margin-bottom:3px}
.formula-item code{font-family:'Cambria Math',serif;font-size:17px;color:var(--pu);white-space:normal}
.formula-note{font-size:13px;color:var(--mut);margin:3px 0 0}
</style>
</head>

<div id="app"><div class="card hero"><div class="big">🧮</div><h2>กำลังโหลดเกม...</h2><p class="sub">หากหน้านี้ค้าง ให้เปิดไฟล์ด้วย Safari</p></div></div>
<script>
window.addEventListener('error', function (event) {
  var root = document.getElementById('app');
  if (root) root.innerHTML = '<div class="card hero"><div class="big">⚠️</div><h2>เกิดข้อผิดพลาดในการเปิดเกม</h2><p class="sub">ลองเปิดไฟล์นี้ด้วย Safari โดยตรง และตรวจสอบว่าอนุญาต JavaScript แล้ว</p><p style="font-size:13px;overflow-wrap:anywhere">' + (event.message || 'ไม่สามารถเริ่มเกมได้') + '</p></div>';
});
</script>
