<!DOCTYPE html>
<html lang="th">
<head>

<title>MATH QUIZ : พิชิตสูตรคณิตศาสตร์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#17133b;--bg2:#090d24;--card:rgba(21,25,61,.88);--tx:#f5f3ff;--mut:#c4c2e8;--pu:#a78bfa;--bl:#60a5fa;--pk:#f0abfc;--gr:#4ade80;--or:#fb923c;--ln:rgba(196,181,253,.28);--ok:rgba(20,83,45,.78);--no:rgba(127,29,29,.78);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;color:var(--tx);background:radial-gradient(ellipse at 18% 18%,rgba(124,58,237,.42),transparent 34%),radial-gradient(ellipse at 82% 28%,rgba(14,165,233,.24),transparent 32%),radial-gradient(ellipse at 70% 85%,rgba(217,70,239,.22),transparent 35%),linear-gradient(145deg,#080b20 0%,#151039 48%,#080d25 100%);background-attachment:fixed;line-height:1.5;position:relative;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 110px,rgba(255,255,255,.9),transparent),radial-gradient(1px 1px at 160px 70px,rgba(196,181,253,.9),transparent),radial-gradient(2px 2px at 230px 180px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 310px 40px,rgba(147,197,253,.9),transparent);background-size:360px 240px;opacity:.8}#app{max-width:760px;margin:0 auto;padding:16px}
.card{background:rgba(18,22,55,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(196,181,253,.25);border-radius:24px;padding:22px;box-shadow:0 14px 42px rgba(0,0,0,.35),0 0 28px rgba(124,58,237,.16);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:30px 20px}
.hero .big{font-size:64px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
h1{margin:6px 0;font-size:clamp(28px,7vw,44px);background:linear-gradient(90deg,var(--pu),var(--pk),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px}
.sub{color:var(--mut);margin:4px 0 18px}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:13px 26px;color:#fff;background:linear-gradient(90deg,var(--pu),var(--bl));cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:linear-gradient(90deg,var(--pk),var(--or))}
.btn.ghost{background:var(--ln);color:var(--tx);box-shadow:none}
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-size:14px}
.rules span{background:rgba(139,92,246,.2);border:1px solid rgba(196,181,253,.25);border-radius:99px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.cat{font:inherit;color:#fff;border:0;border-radius:20px;padding:18px 14px;text-align:left;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.15s}
.cat:hover{transform:translateY(-3px)}.cat b{display:block;font-size:17px}.cat small{opacity:.9}.cat .ic{font-size:30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.pill{background:rgba(139,92,246,.2);border:1px solid rgba(196,181,253,.22);border-radius:99px;padding:4px 12px}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gr),var(--bl));transition:width .4s}
.bar.t i{background:linear-gradient(90deg,var(--or),var(--pk));transition:width 1s linear}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600;margin-right:6px}
.bonus{background:var(--or)}
.q{font-size:clamp(19px,4.6vw,24px);font-weight:600;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:clamp(17px,4.2vw,20px);text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pu);transform:translateX(4px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg1);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.ok{background:var(--ok);border-color:var(--gr);animation:pop .4s}
.opt.no{background:var(--no);border-color:#ef4444;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:14px;padding:14px;border-radius:16px;background:var(--bg1);animation:in .3s}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.score{font-size:64px;font-weight:700;color:var(--pu);margin:0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stats div{background:var(--bg1);border-radius:16px;padding:10px 18px;min-width:110px}
.stats b{display:block;font-size:24px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.2;margin:0 2px}
.fr i{font-style:normal;border-bottom:1.5px solid currentColor;padding:0 3px}.fr b{font-weight:400;padding:0 3px}
.m{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-style:italic;white-space:nowrap}
.m sub,.m sup{font-size:.7em}
.c{text-align:center}

.review-intro{margin:4px 0 16px;color:var(--mut)}
.player-field{max-width:420px;margin:18px auto 14px;text-align:left}.player-field label{display:block;font-weight:600;margin-bottom:7px}.player-field input{width:100%;font:inherit;font-size:17px;padding:13px 15px;border-radius:14px;border:1.5px solid rgba(196,181,253,.45);background:rgba(8,12,35,.72);color:#fff;outline:none}.player-field input:focus{border-color:#c4b5fd;box-shadow:0 0 0 3px rgba(167,139,250,.2)}.player-name{color:#ddd6fe;font-weight:600}.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #a78bfa;box-shadow:0 0 18px rgba(96,165,250,.5);display:block;margin:10px auto}.avatar-small{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #a78bfa;vertical-align:middle;margin-right:6px}.avatar-placeholder{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:10px auto;background:rgba(167,139,250,.16);border:2px dashed rgba(196,181,253,.6);font-size:34px}
.review-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin:14px 0}
.review-tab{font:inherit;text-align:left;border:0;border-radius:15px;padding:12px;color:#fff;font-weight:700;cursor:pointer}
.review-tab small{display:block;font-weight:400;opacity:.9}
.formula-list{display:grid;gap:10px;margin:14px 0}
.formula-item{background:rgba(139,92,246,.13);border:1px solid var(--ln);border-radius:16px;padding:13px 15px}
.formula-head{display:flex;gap:10px;align-items:flex-start}
.formula-name{font-weight:700}
.formula-math{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-size:clamp(18px,4.5vw,23px);text-align:center;margin:9px 0;overflow-x:auto}
.formula-note{font-size:14px;color:var(--mut);margin-top:5px}
.formula-note b{color:var(--tx)}
.review-actions{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.truth-table{width:100%;border-collapse:collapse;text-align:center;font-family:'Cambria Math',serif;background:var(--card);margin-top:8px}
.truth-table th,.truth-table td{border:1px solid var(--ln);padding:5px}

</style>
</head>

<script>
const F=(n,d)=>`<span class="fr"><i>${n}</i><b>${d}</b></span>`;
const M=s=>`<span class="m">${s}</span>`;
const a=(s)=>`a<sub>${s}</sub>`;
// each item: [type, question, [correct, wrong, wrong, wrong], explanation, isBonus]
const CATS=[
{n:'ลำดับและอนุกรม',i:'📈',c:'#7c3aed',q:[
['จำสูตรให้ได้','พจน์ทั่วไปของลำดับเลขคณิต คือข้อใด',[M(a('n')+' = '+a('1')+' + (n − 1)d'),M(a('n')+' = '+a('1')+' + nd'),M(a('n')+' = '+a('1')+'r<sup>n−1</sup>'),M(a('n')+' = '+a('1')+' + (n + 1)d')],'ลำดับเลขคณิตเพิ่มทีละผลต่างร่วม d รวม (n − 1) ครั้งจากพจน์แรก'],
['เติมสูตรให้สมบูรณ์','ผลบวก n พจน์ของลำดับเลขคณิต '+M('S<sub>n</sub> = '+F('n','2')+'('+a('1')+' + ___ )')+' ช่องว่างคือข้อใด',[M(a('n')),M('d'),M('r'),M('n')],'S<sub>n</sub> = (n/2)(a₁ + aₙ) คือจำนวนพจน์หารสอง คูณผลบวกของพจน์แรกกับพจน์สุดท้าย'],
['สูตรนี้เรียกว่าอะไร',M(a('n')+' = '+a('1')+'r<sup>n−1</sup>')+' คือสูตรอะไร',['พจน์ทั่วไปของลำดับเรขาคณิต','พจน์ทั่วไปของลำดับเลขคณิต','ผลบวกอนุกรมอนันต์','ดอกเบี้ยทบต้น'],'มีอัตราส่วนร่วม r ยกกำลัง (n − 1) จึงเป็นลำดับเรขาคณิต'],
['จริงหรือเท็จ','ข้อใดกล่าวถูกต้องเกี่ยวกับ '+M('S<sub>∞</sub> = '+F(a('1'),'1 − r')),['ใช้ได้เมื่อ |r| &lt; 1','ใช้ได้เมื่อ r = 1','ใช้ได้กับทุกค่าของ r','ใช้ได้เมื่อ |r| &gt; 1'],'ผลบวกอนันต์ของอนุกรมเรขาคณิตลู่เข้าก็ต่อเมื่อ |r| &lt; 1'],
['คำถามท้าทายความจำ (โบนัส)','อนุกรมเรขาคณิต '+M(a('1')+' = 3, r = 2')+' จงหา '+M('S<sub>4</sub>'),['45','48','42','24'],'S₄ = 3(2⁴ − 1)/(2 − 1) = 3 × 15 = 45 (หรือ 3+6+12+24 = 45)',1]]},
{n:'ดอกเบี้ยคงต้น',i:'💰',c:'#2563eb',q:[
['จำสูตรให้ได้','สูตรดอกเบี้ยคงต้น คือข้อใด',[M('I = Prt'),M('I = P(1 + rt)'),M('I = '+F('P','rt')),M('I = P + rt')],'ดอกเบี้ยคงต้นคิดจากเงินต้นเดิมทุกปี จึงเท่ากับ เงินต้น × อัตรา × เวลา'],
['เติมสูตรให้สมบูรณ์',M('A = P + ___')+' เป็นจำนวนเงินรวมหลังได้ดอกเบี้ยคงต้น ช่องว่างคืออะไร',[M('I'),M('r'),M('t'),M('P')],'เงินรวม = เงินต้น + ดอกเบี้ย ดังนั้นเติม I'],
['สูตรนี้เรียกว่าอะไร',M('A = P(1 + rt)')+' คือสูตรอะไร',['จำนวนเงินรวมหลังได้ดอกเบี้ยคงต้น','ดอกเบี้ยทบต้น','ดอกเบี้ยคงต้น','มูลค่าเงินแบบทบต้นต่อเนื่อง'],'แทน I = Prt ใน A = P + I จะได้ A = P + Prt = P(1 + rt)'],
['จับคู่สูตรกับเนื้อหา','ในสูตร '+M('I = Prt')+' ตัวแปร t หมายถึงอะไร',['เวลา (ปี)','เงินต้น','อัตราดอกเบี้ยต่อปี','ดอกเบี้ยที่ได้'],'P = เงินต้น, r = อัตราดอกเบี้ยต่อปี, t = เวลาเป็นปี'],
['คำถามท้าทายความจำ (โบนัส)','ฝากเงิน 10,000 บาท ดอกเบี้ยคงต้น 5% ต่อปี นาน 3 ปี ได้ดอกเบี้ยกี่บาท',['1,500','1,575','150','15,000'],'I = 10,000 × 0.05 × 3 = 1,500 บาท',1]]},
{n:'ดอกเบี้ยทบต้น',i:'🌱',c:'#16a34a',q:[
['จำสูตรให้ได้','สูตรดอกเบี้ยทบต้น (r เป็นร้อยละ) คือข้อใด',[M('A = P(1 + '+F('r','100')+')<sup>t</sup>'),M('A = P(1 + r)t'),M('A = P(1 + '+F('rt','100')+')'),M('A = P + Prt')],'ทบต้นทุกปี จึงคูณด้วย (1 + r/100) ซ้ำ t ครั้ง'],
['เติมสูตรให้สมบูรณ์',M('A = P(1 + '+F('r','100')+')<sup>___</sup>')+' เลขชี้กำลังคืออะไร',[M('t'),M('r'),M('P'),M('100')],'เลขชี้กำลังคือจำนวนปีที่ทบต้น คือ t'],
['สูตรนี้เรียกว่าอะไร',M('A = Pe<sup>rt</sup>')+' คือสูตรอะไร',['มูลค่าเงินในอนาคตแบบทบต้นต่อเนื่อง','ดอกเบี้ยคงต้น','ผลบวกอนุกรมเรขาคณิต','พจน์ทั่วไปของลำดับเลขคณิต'],'ใช้เมื่อทบต้นต่อเนื่อง ตัวเลข e ≈ 2.718 และ r เป็นทศนิยม'],
['จริงหรือเท็จ','ข้อใดอธิบายดอกเบี้ยทบต้นได้ถูกต้อง',['นำดอกเบี้ยไปรวมกับเงินต้นเพื่อคิดดอกเบี้ยงวดถัดไป','คิดดอกเบี้ยจากเงินต้นเดิมเท่านั้น','ดอกเบี้ยเท่ากันทุกปีเสมอ','ไม่ขึ้นกับระยะเวลา'],'จุดต่างจากดอกเบี้ยคงต้นคือ ดอกเบี้ยจะถูกนำไปคิดดอกเบี้ยต่อ'],
['คำถามท้าทายความจำ (โบนัส)','เงินต้น 1,000 บาท ดอกเบี้ยทบต้น 10% ต่อปี 2 ปี ได้เงินรวมเท่าใด',['1,210','1,200','1,100','1,221'],'A = 1,000(1.1)² = 1,000 × 1.21 = 1,210 บาท',1]]},
{n:'สมบัติเลขยกกำลัง',i:'🚀',c:'#ec4899',q:[
['จำสูตรให้ได้',M('a<sup>m</sup> · a<sup>n</sup>')+' เท่ากับข้อใด',[M('a<sup>m+n</sup>'),M('a<sup>mn</sup>'),M('a<sup>m−n</sup>'),M('(2a)<sup>m+n</sup>')],'คูณกันที่ฐานเดียวกัน ให้นำเลขชี้กำลังมาบวกกัน'],
['เติมสูตรให้สมบูรณ์',M('(a<sup>m</sup>)<sup>n</sup> = a<sup>___</sup>')+' ช่องว่างคือข้อใด',[M('mn'),M('m + n'),M('m − n'),M('m ÷ n')],'ยกกำลังซ้อนกำลัง ให้นำเลขชี้กำลังมาคูณกัน'],
['สูตรนี้เรียกว่าอะไร',M('a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>')+' (a ≠ 0) คือสมบัติอะไร',['การหารเลขยกกำลังที่มีฐานเท่ากัน','การคูณเลขยกกำลังที่มีฐานเท่ากัน','การยกกำลังของเลขยกกำลัง','การยกกำลังของผลคูณ'],'หารฐานเดียวกัน ให้นำเลขชี้กำลังมาลบกัน'],
['จริงหรือเท็จ','ข้อใดถูกต้อง',[M('a<sup>0</sup> = 1 เมื่อ a ≠ 0'),M('a<sup>0</sup> = 0'),M('a<sup>−n</sup> = −a<sup>n</sup>'),M('(ab)<sup>n</sup> = a<sup>n</sup> + b<sup>n</sup>')],'ที่ถูกคือ a⁰ = 1, a⁻ⁿ = 1/aⁿ และ (ab)ⁿ = aⁿbⁿ'],
['คำถามท้าทายความจำ (โบนัส)','จงหาค่าของ '+M(F('2<sup>3</sup> · 2<sup>4</sup>','2<sup>5</sup>')),['4','8','2','16'],'2^(3+4) ÷ 2⁵ = 2⁷ ÷ 2⁵ = 2² = 4',1]]},
{n:'เซต',i:'🔵',c:'#f97316',q:[
['จำสูตรให้ได้','เซต A ที่มีสมาชิก n ตัว จะมีสับเซตทั้งหมดกี่ตัว',[M('2<sup>n</sup>'),M('n<sup>2</sup>'),M('2n'),M('n!')],'แต่ละสมาชิกเลือกได้ 2 แบบ คือ อยู่หรือไม่อยู่ รวมเป็น 2ⁿ'],
['เติมสูตรให้สมบูรณ์',M('(A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ ___')+' ช่องว่างคือข้อใด',[M('B<sup>c</sup>'),M('B'),M('A ∪ B'),M('∅')],'กฎของเดอมอร์แกน คอมพลีเมนต์ของยูเนียนเท่ากับอินเตอร์เซกชันของคอมพลีเมนต์'],
['สูตรนี้เรียกว่าอะไร',M('(A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>')+' คือกฎอะไร',['กฎของเดอมอร์แกน','กฎการสลับที่','กฎการแจกแจง','กฎการปฏิเสธซ้อน'],'เป็นกฎของเดอมอร์แกนอีกข้อหนึ่ง'],
['จริงหรือเท็จ','ข้อใดถูกต้อง',[M('A ∪ B = B ∪ A'),M('A ∪ B = A ∩ B เสมอ'),M('∅ ไม่เป็นสับเซตของ A'),M('A ⊆ B หมายถึง A = B เสมอ')],'ยูเนียนมีสมบัติสลับที่ และ ∅ เป็นสับเซตของทุกเซต'],

}
function pick(k){if(S.locked)return;S.locked=true;clearInterval(S.tm);const q=S.qs[S.idx],btns=document.querySelectorAll('.opt'),good=k>=0&&q.o[k].ok;
btns.forEach((b,i)=>{b.disabled=true;if(q.o[i].ok)b.classList.add('ok');else if(i===k)b.classList.add('no')});
const pts=q.bonus?3:2;if(good){S.score+=pts;S.right++}
const last=S.idx===S.qs.length-1;
$('fb').innerHTML=`<div class="fb ${good?'ok':'no'}"><b>${good?'🎉 ถูกต้อง! +'+pts+' คะแนน':(k<0?'⏰ หมดเวลา! 0 คะแนน':'❌ ยังไม่ถูก 0 คะแนน')}</b><div style="margin-top:6px">💡 ${q.exp}</div></div><p class="c"><button class="btn" id="nx">${last?'ดูผลคะแนน 🏁':'ข้อต่อไป →'}</button></p>`;
$('nx').onclick=()=>{if(last)result();else{S.idx++;show()}};$('nx').focus()}
